name: Scrape NAV & Deploy TV Microsite

# Runs the scraper once a day, then publishes the site/ folder to GitHub Pages.
# You can also trigger it by hand from the Actions tab (Run workflow).
on:
  schedule:
    # Twice a day so a transient failure in one run is recovered by the other,
    # and the TV never sits on a full day of stale NAV.
    # (GitHub Actions cron is always UTC and may start a while late under load.)
    - cron: "30 22 * * *"   # 22:30 UTC == 04:00 AM IST (morning)
    - cron: "30 17 * * *"   # 17:30 UTC == 11:00 PM IST (evening)
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "site/**"
      - "scraper/**"
      - ".github/workflows/deploy.yml"

permissions:
  contents: read
  pages: write
  id-token: write

# Let a running deploy finish; only keep the newest queued run.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install scraper dependencies
        run: pip install -r scraper/requirements.txt

      - name: Scrape latest NAV + banners from carnelianmf.com
        run: python scraper/scrape.py

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          # Enable the Pages site automatically via the API so the deploy does
          # not depend on the manual Settings → Pages toggle. Requires the
          # pages:write permission granted above.
          enablement: true

      - name: Upload site as Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Deploy to GitHub Pages
        id: deploy
        uses: actions/deploy-pages@v4
